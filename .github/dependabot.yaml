version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      testing-and-quality:
        patterns:
          - "io.rest-assured*"
          - "com.h2database*"
          - "org.jacoco*"
